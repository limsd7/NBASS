<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>학습 밀도 및 패턴 분석 검사</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        @keyframes slide-in-from-right-4 {
            from {
                transform: translateX(1rem);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        .animate-in {
            animation: fade-in 0.5s ease-out, slide-in-from-right-4 0.5s ease-out;
        }
    </style>
</head>

<body class="bg-slate-50">
    <div id="app"></div>

    <script>
        // State
        let analytics = {
            pureStudyRatio: 70,
            avgFocusDuration: 50,
            distractionCount: 3,
            goldenTimeStart: "09:00",
            goldenTimeEnd: "11:00",
            chronotype: 'neutral',
            subjectRatios: {
                korean: 20,
                math: 40,
                english: 20,
                science: 10,
                social: 5,
                other: 5
            },
            goalAchievementRate: 80,
            perceivedDifficulty: 3,
            avgSleepHours: 6,
            studyStreak: 12,
            breakAdequacy: 3,
            energyPattern: 'stable'
        };

        // Render function
        function render() {
            const chronotypes = [
                {
                    id: 'morning',
                    label: '아침형 🌅',
                    desc: '07-09시 최고',
                    detail: '이른 아침에 자연스럽게 일어남. 오전 시간에 집중력이 가장 높고, 밤이 되면 좀림. 비교적 규칙적인 수면 패턴.',
                    color: '#f59e0b',
                    textColor: 'amber'
                },
                {
                    id: 'neutral',
                    label: '중간형 ☀️',
                    desc: '10-14시 최고',
                    detail: '아침형과 저녁형의 중간. 늘잖잠을 자도 기상이 힘들지 않음. 오전 늦게서 오후 이른 시간에 기능이 최적화.',
                    color: '#3b82f6',
                    textColor: 'blue'
                },
                {
                    id: 'evening',
                    label: '저녁형 🌙',
                    desc: '20-24시 최고',
                    detail: '아침에 일어나기 힘들고 오전엔 멍함. 오후 늦게서 밤에 집중력이 정점. 월요병이 심함.',
                    color: '#6366f1',
                    textColor: 'indigo'
                }
            ];

            const energyPatterns = [
                { id: 'stable', label: '안정적', desc: '기복 없이 꾸준한 상태' },
                { id: 'fluctuating', label: '기복있음', desc: '집중이 잘 되다 안되다 함' },
                { id: 'declining', label: '하락형', desc: '오후/저녁에 급격히 지침' }
            ];

            const breakQualities = [
                { v: 1, l: '매우부족' },
                { v: 2, l: '부족' },
                { v: 3, l: '적당' },
                { v: 4, l: '충분' },
                { v: 5, l: '과다(루즈함)' }
            ];

            const selectedChrono = chronotypes.find(t => t.id === analytics.chronotype) || chronotypes[1];

            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="max-w-4xl mx-auto space-y-8 animate-in pb-20 p-8">
                    <div class="flex flex-col items-center text-center gap-4">
                        <img src="/학습밀도 및 패턴 logo.JPG" alt="Logo" class="w-24 h-24 object-contain" onerror="this.style.display='none'" />
                        <div>
                            <h2 class="text-3xl font-extrabold text-slate-900">학습 밀도 및 패턴 분석 검사</h2>
                            <p class="text-slate-500 mt-2">단순 투입 시간보다 중요한 실제 학습의 질을 분석합니다.</p>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                        <!-- 1. 학습 밀도 및 집중력 -->
                        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                            <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
                                <div class="w-2 h-6 bg-blue-600 rounded-full"></div>
                                <h3 class="font-bold text-slate-800 text-xl">1. 학습 밀도 및 집중력</h3>
                            </div>
                            <div class="space-y-6">
                                <div class="space-y-3">
                                    <div class="flex justify-between">
                                        <label class="text-sm font-bold text-slate-700">순공 시간 비율 (%)</label>
                                        <span class="text-blue-600 font-bold">${analytics.pureStudyRatio}%</span>
                                    </div>
                                    <p class="text-[10px] text-slate-400 leading-relaxed">
                                        * 전체 공부 시간 중 스마트폰 확인, 잡념, 단순 착석 시간 등을 제외하고 <b>온전하게 몰입한 실질적인 시간</b>의 비중을 선택하세요.
                                    </p>
                                    <input 
                                        type="range" 
                                        min="0" 
                                        max="100" 
                                        value="${analytics.pureStudyRatio}" 
                                        oninput="updatePureStudyRatio(event)"
                                        class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-blue-600"
                                    />
                                </div>
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="space-y-2">
                                        <label class="text-xs font-bold text-slate-500">평균 집중 시간 (분)</label>
                                        <input 
                                            type="number" 
                                            value="${analytics.avgFocusDuration}" 
                                            oninput="updateAvgFocusDuration(event)"
                                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-xs font-bold text-slate-500">산만도 (시간당 주의분산 횟수)</label>
                                        <input 
                                            type="number" 
                                            value="${analytics.distractionCount}" 
                                            oninput="updateDistractionCount(event)"
                                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 2. 시간대별 효율성 -->
                        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                            <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
                                <div class="w-2 h-6 bg-amber-500 rounded-full"></div>
                                <h3 class="font-bold text-slate-800 text-xl">2. 시간대별 효율성</h3>
                            </div>
                            <div class="space-y-6">
                                <div class="grid grid-cols-2 gap-4">
                                    <div class="space-y-2">
                                        <label class="text-xs font-bold text-slate-500">골든타임 시작</label>
                                        <input 
                                            type="time" 
                                            value="${analytics.goldenTimeStart}" 
                                            oninput="updateGoldenTimeStart(event)"
                                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                    <div class="space-y-2">
                                        <label class="text-xs font-bold text-slate-500">골든타임 종료</label>
                                        <input 
                                            type="time" 
                                            value="${analytics.goldenTimeEnd}" 
                                            oninput="updateGoldenTimeEnd(event)"
                                            class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                        />
                                    </div>
                                </div>
                                <div class="space-y-3">
                                    <label class="text-sm font-bold text-slate-700">일주기 유형 (Chronotype)</label>
                                    <p class="text-[10px] text-amber-600 bg-amber-50 p-2 rounded-lg">💡 외부 자극 없이 본능적으로 뇌의 각성이 가장 높은 시간대를 선택하세요. 아침에 잘 일어나고 오전에 집중이 잘 되나요? 아니면 밤에 더 머리가 맑아지나요?</p>
                                    <div class="grid grid-cols-3 gap-3">
                                        ${chronotypes.map(t => `
                                            <button 
                                                onclick="selectChronotype('${t.id}')"
                                                class="flex flex-col items-center p-3 rounded-xl border transition-all ${analytics.chronotype === t.id
                    ? 'text-white border-transparent shadow-md'
                    : 'bg-white text-slate-400 border-slate-200 hover:border-slate-300'
                }"
                                                style="${analytics.chronotype === t.id ? `background-color: ${t.color}` : ''}"
                                            >
                                                <span class="text-sm font-bold">${t.label}</span>
                                                <span class="text-[9px] ${analytics.chronotype === t.id ? 'text-white/80' : 'text-slate-400'}">${t.desc}</span>
                                            </button>
                                        `).join('')}
                                    </div>
                                    ${analytics.chronotype ? `
                                        <div class="p-3 rounded-xl border ${selectedChrono.textColor === 'amber' ? 'bg-amber-50 border-amber-200' :
                        selectedChrono.textColor === 'blue' ? 'bg-blue-50 border-blue-200' :
                            'bg-indigo-50 border-indigo-200'
                    }">
                                            <p class="text-[11px] font-medium ${selectedChrono.textColor === 'amber' ? 'text-amber-700' :
                        selectedChrono.textColor === 'blue' ? 'text-blue-700' :
                            'text-indigo-700'
                    }">
                                                ✓ ${selectedChrono.detail}
                                            </p>
                                        </div>
                                    ` : ''}
                                </div>
                            </div>
                        </div>

                        <!-- 3. 과목별 균형 -->
                        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6 md:col-span-2">
                            <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
                                <div class="w-2 h-6 bg-indigo-600 rounded-full"></div>
                                <h3 class="font-bold text-slate-800 text-xl">3. 과목별 균형 및 취약점</h3>
                            </div>
                            <div class="grid grid-cols-1 md:grid-cols-3 gap-8">
                                <div class="space-y-4 md:col-span-2">
                                    <label class="text-sm font-bold text-slate-700">과목별 시간 배분 (%)</label>
                                    <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                                        ${Object.entries(analytics.subjectRatios).map(([key, val]) => {
                        const labels = {
                            korean: '국어',
                            math: '수학',
                            english: '영어',
                            science: '과학',
                            social: '사회',
                            other: '기타'
                        };
                        return `
                                                <div class="space-y-1">
                                                    <label class="text-[10px] font-bold text-slate-400 uppercase">${labels[key] || key}</label>
                                                    <input 
                                                        type="number" 
                                                        value="${val}" 
                                                        oninput="updateSubjectRatio('${key}', event)"
                                                        class="w-full p-2 bg-slate-50 border border-slate-200 rounded-lg text-center font-bold text-sm"
                                                    />
                                                </div>
                                            `;
                    }).join('')}
                                    </div>
                                </div>
                                <div class="space-y-6">
                                    <div class="space-y-3">
                                        <div class="flex justify-between">
                                            <label class="text-sm font-bold text-slate-700">목표 달성률</label>
                                            <span class="text-indigo-600 font-bold">${analytics.goalAchievementRate}%</span>
                                        </div>
                                        <p class="text-[10px] text-slate-400">* 계획한 분량(페이지/문제) 단순 끝내기가 아닌 <b>'완벽한 복습과 이해'</b>가 이루어진 정도를 포함하세요.</p>
                                        <input 
                                            type="range" 
                                            min="0" 
                                            max="100" 
                                            value="${analytics.goalAchievementRate}" 
                                            oninput="updateGoalAchievementRate(event)"
                                            class="w-full h-2 bg-slate-100 rounded-lg appearance-none cursor-pointer accent-indigo-600"
                                        />
                                    </div>
                                    <div class="space-y-3">
                                        <div class="flex justify-between items-start">
                                            <label class="text-sm font-bold text-slate-700">체감 학습 난이도 (Difficulty)</label>
                                        </div>
                                        <p class="text-[10px] text-indigo-600 bg-indigo-50 p-2 rounded-lg">💡 지금 공부하는 내용이 나에게 얼마나 어렵게 느껴지나요? 너무 쉽거나 너무 어려우면 몰입이 어렵습니다.</p>
                                        <div class="flex gap-2">
                                            ${[1, 2, 3, 4, 5].map(v => `
                                                <button 
                                                    onclick="selectPerceivedDifficulty(${v})"
                                                    class="flex-1 py-2 rounded-lg font-bold border transition-all ${analytics.perceivedDifficulty === v
                            ? 'bg-indigo-600 text-white border-indigo-600'
                            : 'bg-white text-slate-400 border-slate-200 hover:border-indigo-200'
                        }"
                                                >
                                                    ${v}
                                                </button>
                                            `).join('')}
                                        </div>
                                        <div class="grid grid-cols-5 gap-1 text-[8px] text-slate-400 text-center leading-tight">
                                            <span>1: 매우 쉬움<br/>(단순 복습)</span>
                                            <span>2: 쉬움<br/>(이해 완료)</span>
                                            <span>3: 보통<br/>(적정 자극)</span>
                                            <span>4: 어려움<br/>(심화 단계)</span>
                                            <span>5: 매우 어려움<br/>(개념 생소)</span>
                                        </div>
                                        ${analytics.perceivedDifficulty ? `
                                            <div class="p-3 bg-indigo-50 rounded-xl border border-indigo-100">
                                                <p class="text-[10px] text-indigo-700 font-medium">
                                                    ✓ ${analytics.perceivedDifficulty === 1 ? '이미 다 아는 내용이라 쉽습니다. 새로운 내용이나 심화 학습이 필요할 수 있습니다.' :
                        analytics.perceivedDifficulty === 2 ? '대부분 이해했으며 복습 수준입니다. 학습 효율이 높은 상태입니다.' :
                            analytics.perceivedDifficulty === 3 ? '노력하면 충분히 이해할 수 있는 적정 난이도입니다. 몰입에 가장 좋은 상태!' :
                                analytics.perceivedDifficulty === 4 ? '난이도가 높아 시간이 많이 걸립니다. 기초 복습이 도움이 될 수 있습니다.' :
                                    '개념 자체가 생소하여 이해가 어렵습니다. 기본 개념부터 다시 학습하는 것을 권장합니다.'
                    }
                                                </p>
                                            </div>
                                        ` : ''}
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 4. 환경 및 컨디션 -->
                        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                            <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
                                <div class="w-2 h-6 bg-emerald-600 rounded-full"></div>
                                <h3 class="font-bold text-slate-800 text-xl">4. 환경 및 컨디션</h3>
                            </div>
                            <div class="grid grid-cols-2 gap-4">
                                <div class="space-y-2">
                                    <label class="text-xs font-bold text-slate-500">평균 수면 시간</label>
                                    <input 
                                        type="number" 
                                        value="${analytics.avgSleepHours}" 
                                        oninput="updateAvgSleepHours(event)"
                                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                    />
                                </div>
                                <div class="space-y-2">
                                    <label class="text-xs font-bold text-slate-500">연속 학습 일수 (Study Streak)</label>
                                    <p class="text-[10px] text-slate-400 leading-tight">하루 4시간 이상 학습을 쉬지 않고 이어온 기간입니다. (번아웃 예측용)</p>
                                    <input 
                                        type="number" 
                                        value="${analytics.studyStreak}" 
                                        oninput="updateStudyStreak(event)"
                                        class="w-full p-3 bg-slate-50 border border-slate-200 rounded-xl font-bold"
                                    />
                                </div>
                            </div>
                        </div>

                        <!-- 5. 피로도 및 휴식 -->
                        <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm space-y-6">
                            <div class="flex items-center gap-3 border-b border-slate-100 pb-4">
                                <div class="w-2 h-6 bg-red-600 rounded-full"></div>
                                <h3 class="font-bold text-slate-800 text-xl">5. 피로도 및 휴식</h3>
                            </div>
                            <div class="space-y-6">
                                <div class="space-y-3">
                                    <label class="text-sm font-bold text-slate-700">휴식 적절성 (Break Quality)</label>
                                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100">
                                        <p class="text-[10px] text-slate-500 leading-relaxed">
                                            💡 <b>의미:</b> 학습 후 뇌의 인지적 과부하가 해소되고('머리가 맑아짐'), 다음 공부를 시작할 에너지가 충분히 충전되었는지 평가합니다.
                                        </p>
                                    </div>
                                    <div class="flex gap-2">
                                        ${breakQualities.map(item => `
                                            <button 
                                                onclick="selectBreakAdequacy(${item.v})"
                                                class="flex-1 py-2 rounded-lg text-[10px] font-bold border transition-all ${analytics.breakAdequacy === item.v
                            ? 'bg-red-600 text-white border-red-600 shadow-sm'
                            : 'bg-white text-slate-400 border-slate-200'
                        }"
                                            >
                                                ${item.l}
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                                <div class="space-y-3">
                                    <label class="text-sm font-bold text-slate-700">집중력 에너지 패턴 (Daily Pattern)</label>
                                    <p class="text-[10px] text-slate-400">하루 전체를 통틀어 집중력이 유지되는 흐름을 선택하세요.</p>
                                    <div class="grid grid-cols-3 gap-2">
                                        ${energyPatterns.map(p => `
                                            <button 
                                                onclick="selectEnergyPattern('${p.id}')"
                                                class="flex flex-col items-center py-2.5 rounded-xl border transition-all ${analytics.energyPattern === p.id
                                ? 'bg-red-600 text-white border-red-600'
                                : 'bg-white text-slate-400 border-slate-200'
                            }"
                                            >
                                                <span class="text-[11px] font-bold">${p.label}</span>
                                                <span class="text-[8px] ${analytics.energyPattern === p.id ? 'text-red-100' : 'text-slate-400'}">${p.desc}</span>
                                            </button>
                                        `).join('')}
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Buttons -->
                    <div class="flex gap-4">
                        <button onclick="handleBack()" class="flex-1 py-4 bg-white border border-slate-200 text-slate-600 font-bold rounded-2xl hover:bg-slate-50 transition-all">
                            Back
                        </button>
                        <button onclick="handleNext()" class="flex-[2] py-4 bg-blue-600 text-white font-bold rounded-2xl shadow-lg hover:bg-blue-700 transition-all">
                            Generate Report
                        </button>
                    </div>
                </div>
            `;
        }

        // Event handlers
        function updatePureStudyRatio(event) {
            analytics.pureStudyRatio = parseInt(event.target.value);
            render();
        }

        function updateAvgFocusDuration(event) {
            analytics.avgFocusDuration = parseInt(event.target.value);
        }

        function updateDistractionCount(event) {
            analytics.distractionCount = parseInt(event.target.value);
        }

        function updateGoldenTimeStart(event) {
            analytics.goldenTimeStart = event.target.value;
        }

        function updateGoldenTimeEnd(event) {
            analytics.goldenTimeEnd = event.target.value;
        }

        function selectChronotype(id) {
            analytics.chronotype = id;
            render();
        }

        function updateSubjectRatio(key, event) {
            analytics.subjectRatios[key] = parseInt(event.target.value);
        }

        function updateGoalAchievementRate(event) {
            analytics.goalAchievementRate = parseInt(event.target.value);
            render();
        }

        function selectPerceivedDifficulty(value) {
            analytics.perceivedDifficulty = value;
            render();
        }

        function updateAvgSleepHours(event) {
            analytics.avgSleepHours = parseInt(event.target.value);
        }

        function updateStudyStreak(event) {
            analytics.studyStreak = parseInt(event.target.value);
        }

        function selectBreakAdequacy(value) {
            analytics.breakAdequacy = value;
            render();
        }

        function selectEnergyPattern(id) {
            analytics.energyPattern = id;
            render();
        }

        function handleBack() {
            // Send data back to parent window
            if (window.opener) {
                window.opener.postMessage({
                    type: 'ANALYTICS_BACK',
                    data: analytics
                }, '*');
            }
            window.close();
        }

        function handleNext() {
            // Send data back to parent window
            if (window.opener) {
                window.opener.postMessage({
                    type: 'ANALYTICS_COMPLETE',
                    data: analytics
                }, '*');
            }
            window.close();
        }

        // Initial render
        render();
    </script>
</body>

</html>
