<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>처방 가이드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes wave {

            0%,
            100% {
                height: 20%;
                opacity: 0.3;
            }

            50% {
                height: 90%;
                opacity: 0.8;
            }
        }

        .wave-bar {
            animation: wave 2s ease-in-out infinite;
        }
    </style>
</head>

<body class="bg-[#020617] m-0 p-0 overflow-hidden">
    <div id="prescription-root"></div>

    <script type="module">
        // Get prescription data from URL params
        const urlParams = new URLSearchParams(window.location.search);
        const prescriptionData = JSON.parse(decodeURIComponent(urlParams.get('data') || '{}'));

        console.log('Prescription data:', prescriptionData);

        // State management
        let isPrepMode = true;
        let prepTimeLeft = 15;
        let step = 0;
        let progress = 0;
        let breathingPhase = 'inhale';
        let breathingScale = 1;
        let simulatedScore = 60;
        let breathingTimeout = null;

        // Posture guides per title/activity
        function getPostureGuide() {
            const title = prescriptionData.title || '';
            const activity = prescriptionData.activity || '';

            if (title.includes('Spark') || title.includes('불씨') || activity.includes('척추')) {
                return {
                    title: "바른 척추 & 가슴 열기 자세",
                    points: [
                        "의자 끝에 엉덩이를 걸치고 허리와 척추를 곧게 세웁니다.",
                        "어깨의 힘을 빼고 가슴을 활짝 열어 호흡 통로를 확보합니다.",
                        "두 발을 바닥에 나란히 붙이고 두 손은 무릎 위에 편안히 올려놓습니다.",
                        "턱을 살짝 당기고 시선은 편안하게 45도 아래를 바라봅니다."
                    ],
                    voicePrompt: "호흡을 시작하기 전 준비 자세를 잡습니다. 의자에 앉아 척추를 바르게 세우고, 가슴을 활짝 펴주세요. 어깨의 힘을 빼고 편안하게 호흡할 준비를 합니다."
                };
            } else if (title.includes('Pause') || title.includes('멈춤') || title.includes('이완') || title.includes('Recharge')) {
                return {
                    title: "깊은 이완 & 안정화 자세",
                    points: [
                        "등받이에 몸을 편안히 기대고 온몸의 긴장을 풉니다.",
                        "어깨를 귀까지 올렸다가 '툭' 떨어뜨려 근육을 이완합니다.",
                        "두 손을 배(단전) 위에 가볍게 얹어 호흡의 움직임을 느낍니다.",
                        "눈을 지그시 감거나 시선을 낮추어 편안한 상태를 만듭니다."
                    ],
                    voicePrompt: "시작 전 몸과 마음을 이완합니다. 온몸의 긴장을 풀고, 두 손을 편안하게 배 위에 올려놓으세요."
                };
            } else {
                return {
                    title: "호흡 명상 준비 자세",
                    points: [
                        "허리를 곧게 펴고 앉아 편안한 상태를 만듭니다.",
                        "어깨와 목의 힘을 완전히 빼고 자연스러운 호흡을 준비합니다.",
                        "양손은 손바닥이 위를 향하도록 무릎 위에 가볍게 놓습니다.",
                        "호흡의 흐름에 온전히 집중할 준비를 합니다."
                    ],
                    voicePrompt: "시작 전 바른 자세를 취합니다. 허리를 펴고 어깨의 힘을 뺀 후 호흡에 집중할 준비를 해주세요."
                };
            }
        }

        const postureInfo = getPostureGuide();

        // TTS functionality
        function speak(text, forceRate = 0.9) {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'ko-KR';
            utterance.rate = forceRate;
            utterance.pitch = 1.0;

            window.speechSynthesis.speak(utterance);
        }

        // Render function
        function render() {
            const root = document.getElementById('prescription-root');

            if (isPrepMode) {
                // 15-second posture preparation screen
                root.innerHTML = `
                    <div class="fixed inset-0 flex items-center justify-center bg-[#020617]">
                        <!-- Background -->
                        <div class="absolute inset-0 overflow-hidden pointer-events-none">
                            <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-amber-500/15 rounded-full blur-[120px] animate-pulse"></div>
                            <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-indigo-500/20 rounded-full blur-[120px] animate-pulse" style="animation-delay: 1.5s"></div>
                        </div>

                        <div class="relative w-full max-w-4xl h-full p-8 flex flex-col items-center justify-center z-10">
                            <!-- Exit Button -->
                            <button 
                                onclick="window.close()"
                                class="absolute top-8 right-8 w-14 h-14 flex items-center justify-center bg-white/20 hover:bg-white/40 text-white rounded-full transition-all duration-300 group shadow-2xl z-[120]"
                            >
                                <span class="text-3xl group-hover:rotate-90 transition-transform duration-300">✕</span>
                            </button>

                            <!-- Header -->
                            <div class="text-center mb-8">
                                <div class="inline-flex items-center gap-2 px-4 py-1.5 rounded-full bg-amber-500/20 border border-amber-500/30 text-amber-300 text-xs font-black tracking-widest uppercase mb-4 animate-pulse">
                                    <span>🧘</span> STEP 0 : PREPARATION
                                </div>
                                <h2 class="text-4xl font-black text-white tracking-tight drop-shadow-lg mb-2">${prescriptionData.title || '작은 불씨 살리기 (Spark)'}</h2>
                                <p class="text-indigo-300 font-bold text-base">시작 전, 최적의 호흡 효과를 위해 자세를 정돈해 주세요</p>
                            </div>

                            <!-- Posture Guide Card with Countdown -->
                            <div class="w-full max-w-2xl bg-slate-900/80 border border-white/15 rounded-3xl p-8 backdrop-blur-xl shadow-2xl relative overflow-hidden">
                                <div class="flex items-center justify-between border-b border-white/10 pb-5 mb-6">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 rounded-xl bg-amber-500/20 border border-amber-500/40 flex items-center justify-center text-amber-400 text-xl font-black">
                                            ✨
                                        </div>
                                        <div>
                                            <h3 class="text-xl font-bold text-white">${postureInfo.title}</h3>
                                            <p class="text-xs text-slate-400">15초 동안 안내에 따라 바른 자세를 취하세요</p>
                                        </div>
                                    </div>
                                    <div class="flex items-center gap-2">
                                        <div class="w-14 h-14 rounded-2xl bg-gradient-to-br from-amber-500 to-orange-600 flex flex-col items-center justify-center shadow-lg shadow-amber-500/30 animate-bounce">
                                            <span class="text-2xl font-black text-white tabular-nums leading-none" id="prep-timer">${prepTimeLeft}</span>
                                            <span class="text-[9px] font-bold text-amber-100 uppercase mt-0.5">SEC</span>
                                        </div>
                                    </div>
                                </div>

                                <div class="space-y-3.5 mb-8">
                                    ${postureInfo.points.map((point, idx) => `
                                        <div class="flex items-start gap-3.5 p-3 rounded-xl bg-white/5 border border-white/5">
                                            <span class="w-6 h-6 rounded-lg bg-indigo-500/30 text-indigo-300 font-bold text-xs flex items-center justify-center flex-shrink-0 mt-0.5">${idx + 1}</span>
                                            <p class="text-slate-200 text-sm font-medium leading-relaxed">${point}</p>
                                        </div>
                                    `).join('')}
                                </div>

                                <!-- Skip / Immediate Start Button -->
                                <div class="flex justify-center">
                                    <button
                                        onclick="startPrescriptionGuide()"
                                        class="px-8 py-3 bg-gradient-to-r from-indigo-600 to-emerald-600 hover:from-indigo-500 hover:to-emerald-500 text-white font-black text-sm rounded-xl shadow-lg transition-all flex items-center gap-2 hover:scale-105"
                                    >
                                        <span>자세 준비 완료 • 바로 시작하기</span>
                                        <span>▶</span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                return;
            }

            // Main Zen Guide Screen
            const currentStep = (prescriptionData.guide && prescriptionData.guide[step]) || '';

            root.innerHTML = `
                <div class="fixed inset-0 flex items-center justify-center bg-[#020617]">
                    <!-- Background -->
                    <div class="absolute inset-0 overflow-hidden pointer-events-none">
                        <div class="absolute top-1/4 left-1/4 w-96 h-96 bg-indigo-500/20 rounded-full blur-[120px] animate-pulse"></div>
                        <div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-emerald-500/20 rounded-full blur-[120px] animate-pulse" style="animation-delay: 2s"></div>
                    </div>
                    
                    <div class="relative w-full max-w-5xl h-full p-8 flex flex-col items-center justify-center z-10">
                        <!-- Exit Button -->
                        <button 
                            onclick="window.close()"
                            class="absolute top-8 right-8 w-14 h-14 flex items-center justify-center bg-white/20 hover:bg-white/40 text-white rounded-full transition-all duration-300 group shadow-2xl z-[120]"
                        >
                            <span class="text-3xl group-hover:rotate-90 transition-transform duration-300">✕</span>
                        </button>
                        
                        <!-- Header -->
                        <div class="text-center mb-10">
                            <p class="text-indigo-400 font-bold tracking-[0.4em] uppercase text-[11px] mb-3">Digital Prescription Zen-Mode</p>
                            <h2 class="text-5xl font-black text-white tracking-tight drop-shadow-lg">${prescriptionData.title || ''}</h2>
                            <div class="mt-5 flex items-center justify-center gap-6 text-white/60 text-sm">
                                <div class="flex items-center gap-2">
                                    <span class="relative flex h-3 w-3">
                                        <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
                                        <span class="relative inline-flex rounded-full h-3 w-3 bg-emerald-500"></span>
                                    </span>
                                    <span class="font-bold tracking-widest text-emerald-400">NEURAL SENSOR ACTIVE</span>
                                </div>
                                <span class="w-px h-4 bg-white/20"></span>
                                <span class="font-medium tracking-wide">${prescriptionData.activity || ''}</span>
                            </div>
                        </div>
                        
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-12 w-full items-center mb-10">
                            <!-- Left: Breathing Circle with dynamic Phase Text -->
                            <div class="flex flex-col items-center justify-center space-y-12">
                                <div class="relative flex items-center justify-center scale-110 lg:scale-125">
                                    <div class="absolute w-44 h-44 rounded-full border border-indigo-500/20 transition-all duration-[4000ms] ease-in-out" id="outer-ring"></div>
                                    <div class="absolute w-44 h-44 rounded-full bg-gradient-to-br from-indigo-500/10 to-emerald-500/10 blur-2xl transition-all duration-[4000ms] ease-in-out" id="blur-ring"></div>
                                    <div class="w-44 h-44 rounded-full bg-gradient-to-br from-indigo-600 via-indigo-500 to-emerald-500 flex flex-col items-center justify-center shadow-[0_0_60px_rgba(79,70,229,0.4)] transition-all duration-[4000ms] ease-in-out z-10" id="breathing-circle">
                                        <p class="text-white font-black text-2xl tracking-tighter" id="breathing-text">IN</p>
                                        <p class="text-indigo-100 text-xs font-bold mt-1" id="breathing-subtext">숨을 들이마십니다</p>
                                    </div>
                                </div>
                                
                                <!-- Biofeedback -->
                                <div class="w-full max-w-sm bg-slate-900/50 border border-white/10 rounded-3xl p-6 backdrop-blur-md shadow-2xl">
                                    <div class="flex justify-between items-end mb-4">
                                        <div>
                                            <p class="text-[9px] font-bold text-slate-500 uppercase tracking-[0.2em] mb-1">Bio-Metric Pulse</p>
                                            <h4 class="text-xl font-bold text-white tracking-tight">Brain Stability</h4>
                                        </div>
                                        <div class="text-right">
                                            <p class="text-3xl font-black text-emerald-400 tabular-nums">
                                                <span id="score">${simulatedScore.toFixed(1)}</span>
                                                <span class="text-[10px] text-emerald-500/50 uppercase">pts</span>
                                            </p>
                                        </div>
                                    </div>
                                    <div class="h-12 flex items-center gap-1.5" id="wave-bars"></div>
                                </div>
                            </div>
                            
                            <!-- Right: Steps -->
                            <div class="space-y-4 max-w-md mx-auto lg:mx-0">
                                ${(prescriptionData.guide || []).map((g, i) => `
                                    <div class="p-5 rounded-2xl transition-all duration-700 border ${i === step
                                        ? 'bg-white/10 border-white/20 scale-105 shadow-2xl translate-x-2'
                                        : i < step
                                            ? 'bg-emerald-500/5 border-emerald-500/10 opacity-30 shadow-none scale-95'
                                            : 'bg-white/5 border-white/5 opacity-10 blur-[1px]'
                                    }">
                                        <div class="flex gap-4 items-start">
                                            <span class="w-7 h-7 rounded-lg flex items-center justify-center font-black text-xs transition-colors duration-500 ${i === step
                                                ? 'bg-indigo-500 text-white shadow-lg shadow-indigo-500/30'
                                                : i < step
                                                    ? 'bg-emerald-500 text-white'
                                                    : 'bg-white/10 text-white/20'
                                            }">
                                                ${i < step ? '✓' : i + 1}
                                            </span>
                                            <div class="flex-1">
                                                <p class="font-bold leading-relaxed transition-all duration-500 ${i === step ? 'text-white text-base' : 'text-white/40 text-sm'}">
                                                    ${g}
                                                </p>
                                                ${i === step ? `
                                                    <div class="mt-3 h-1 w-full bg-white/5 rounded-full overflow-hidden">
                                                        <div class="h-full bg-gradient-to-r from-indigo-500 to-emerald-500 transition-all duration-100" style="width: ${progress}%"></div>
                                                    </div>
                                                ` : ''}
                                            </div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                        
                        <!-- Footer -->
                        <div class="flex flex-col items-center gap-6 mt-4">
                            <button 
                                onclick="window.close()"
                                class="px-10 py-4 bg-white/10 hover:bg-white text-white hover:text-slate-900 rounded-2xl font-bold transition-all duration-300 border border-white/10 hover:border-white shadow-xl flex items-center gap-3 group"
                            >
                                <span>진료 완료 및 리포트로 복귀</span>
                                <span class="text-xl group-hover:translate-x-1 transition-transform">→</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;

            // Create wave bars
            const waveBars = document.getElementById('wave-bars');
            if (waveBars) {
                waveBars.innerHTML = Array(24).fill(0).map((_, i) => `
                    <div class="flex-1 bg-gradient-to-t from-emerald-600/20 to-emerald-400/40 rounded-full transition-all duration-700 wave-bar" 
                         style="height: ${15 + Math.random() * 70}%; animation-delay: ${i * 0.08}s"></div>
                `).join('');
            }
        }

        // Breathing animation with Voice Cues (IN, HOLD, OUT)
        function updateBreathing() {
            if (isPrepMode) return;

            const circle = document.getElementById('breathing-circle');
            const outerRing = document.getElementById('outer-ring');
            const blurRing = document.getElementById('blur-ring');
            const text = document.getElementById('breathing-text');
            const subtext = document.getElementById('breathing-subtext');

            if (!circle) return;

            if (breathingPhase === 'inhale') {
                breathingScale = 1.4;
                circle.style.transform = 'scale(1.4)';
                if (outerRing) outerRing.style.transform = 'scale(1.6 * 1.6)';
                if (outerRing) outerRing.style.opacity = '0.2';
                if (blurRing) blurRing.style.transform = 'scale(1.4 * 1.3)';
                if (text) text.textContent = 'IN';
                if (subtext) subtext.textContent = '숨을 들이마십니다 (IN)';
                speak('숨을 천천히 들이마십니다.', 0.95);

                breathingTimeout = setTimeout(() => { 
                    breathingPhase = 'hold'; 
                    updateBreathing(); 
                }, 4000);
            } else if (breathingPhase === 'hold') {
                if (text) text.textContent = 'HOLD';
                if (subtext) subtext.textContent = '숨을 멈춥니다 (HOLD)';
                speak('숨을 멈춥니다.', 0.95);

                breathingTimeout = setTimeout(() => { 
                    breathingPhase = 'exhale'; 
                    updateBreathing(); 
                }, 4000);
            } else {
                breathingScale = 1.0;
                circle.style.transform = 'scale(1.0)';
                if (outerRing) outerRing.style.transform = 'scale(1.6)';
                if (blurRing) blurRing.style.transform = 'scale(1.3)';
                if (text) text.textContent = 'OUT';
                if (subtext) subtext.textContent = '숨을 길게 내쉽니다 (OUT)';
                speak('숨을 천천히 길게 내뱉습니다.', 0.95);

                breathingTimeout = setTimeout(() => { 
                    breathingPhase = 'inhale'; 
                    updateBreathing(); 
                }, 6000);
            }
        }

        // Start Zen Guide
        window.startPrescriptionGuide = function() {
            if (!isPrepMode) return;
            isPrepMode = false;
            render();
            setTimeout(() => {
                const firstStepGuide = (prescriptionData.guide && prescriptionData.guide[0]) || '';
                speak(`처방 가이드를 시작합니다. 첫 번째 단계입니다. ${firstStepGuide}`);
                setTimeout(() => {
                    updateBreathing();
                }, 4500);
            }, 500);
        };

        // Preparation 15-second countdown timer
        const prepInterval = setInterval(() => {
            if (!isPrepMode) {
                clearInterval(prepInterval);
                return;
            }

            prepTimeLeft--;
            const timerEl = document.getElementById('prep-timer');
            if (timerEl) {
                timerEl.textContent = prepTimeLeft;
            }

            if (prepTimeLeft <= 0) {
                clearInterval(prepInterval);
                window.startPrescriptionGuide();
            }
        }, 1000);

        // Progress management for Guide steps
        const durationPerStep = 60000; // 60 seconds per step
        setInterval(() => {
            if (isPrepMode) return;

            progress += (100 / (durationPerStep / 100));

            if (progress >= 100) {
                if (step < (prescriptionData.guide || []).length - 1) {
                    step++;
                    progress = 0;
                    speak(`다음 단계입니다. ${prescriptionData.guide[step]}`);
                    render();
                } else {
                    progress = 100;
                }
            }

            // Update score
            const target = 85 + (step * 3);
            if (simulatedScore < target) {
                simulatedScore += 0.1;
                const scoreEl = document.getElementById('score');
                if (scoreEl) scoreEl.textContent = simulatedScore.toFixed(1);
            }

            // Update progress bar
            const progressBar = document.querySelector('.bg-gradient-to-r');
            if (progressBar) progressBar.style.width = `${progress}%`;

        }, 100);

        // Initial launch
        render();
        setTimeout(() => {
            speak(postureInfo.voicePrompt);
        }, 600);

        // ESC to close
        window.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (breathingTimeout) clearTimeout(breathingTimeout);
                window.speechSynthesis.cancel();
                window.close();
            }
        });
    </script>
</body>

</html>
