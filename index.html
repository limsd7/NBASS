  <!--
    ============================================================================
    [성적 관리 시스템 (Grade Management System) 기능 상세 명세서]
    ============================================================================
    1. 개요
       - 12대 CareType(두뇌 신경인지 상태: 번아웃, 과긴장, 저활력, 뇌피로, 주의력결핍 등)과
         국어·수학·영어 수능 성적 및 취약단원을 유기적으로 결합한 차세대 듀얼트랙 성적 관리 플랫폼입니다.
       - 좌우 여백을 극대화한 와이드 풀스크린 레이아웃으로 광활한 정보 가독성을 제공합니다.

    2. 최상단 8대 핵심 메뉴 탭 구조
       (1) 📊 대시보드 (StudyDashboard)
           - 전 과목 최근 성적 요약, 평균 등급, 모의고사 성적 추이 라인/바 차트
           - 12대 CareType 맞춤 국·수·영 사다리 훈련 바로가기 3분할 밸런스 카드 (국어 1위, 수학 1위, 영어 1위)
           - 과목별 실시간 탭 전환 (국·수·영 밸런스 / 국어 TOP 3 / 수학 TOP 3 / 영어 TOP 3)
           - CSV 성적 가져오기/내보내기 연동

       (2) 📝 성적 관리 (StudyGradeManager)
           - 시험별(3/6/9 모의고사, 학력평가, 수능, 사설 등) 전 과목 성적표 데이터 테이블
           - 과목별 원점수, 표준점수, 백분위, 등급 및 지정된 취약단원 TOP 1·2·3순위 뱃지 시각화
           - 취약단원 미입력 시에도 과목별 즉시 훈련(수학: 수열, 국어: 독서, 영어: 빈칸) 퀵 버튼 지원

       (3) 🎯 목표 & AI 플랜 (StudyGoalsAndAIPlan)
           - 과목별 3단계 목표 등급(Tier 1 안정 목표, Tier 2 도약 목표, Tier 3 만점 도전 목표)
           - 대학/학과별 실시간 정시 등급컷 데이터베이스 자동 동기화
           - AI 과목별 주간 학습 시간 & 뽀모도로 탄력 타이머 배분 플랜

       (4) 🎓 수능 1·2·3년 로드맵 (NeuroRoadmapStudio)
           - 수능 준비 기간별 AI 맞춤 로드맵 자동 생성:
             * 1년 로드맵 (고3/N수생 4분기 D-Day 플랜)
             * 2년 로드맵 (고2 8분기 심화 플랜)
             * 3년 로드맵 (고1 12분기 기초부터 완성 플랜)
           - [국어], [수학], [영어] 교과 마일스톤과 [12대 CareType 두뇌 케어] 마일스톤의 듀얼트랙 편성
           - 과목별 실시간 필터 탭 (전 과목 / 국어 / 수학 / 영어 / 두뇌케어)
           - 마일스톤 완료 체크, 추가, 수정, 삭제 및 인쇄/PDF 저장 지원

       (5) 🪜 국·수·영 6단계 AI 사다리 훈련 (NeuroStudyLadderCenter)
           - 12대 CareType 특화 신경인지 4단계 학습 프로세스:
             [1단계: 두뇌 프라이밍(이완/각성)] ➔ [2단계: 필수 개념 3문항 메타점검] ➔
             [3단계: A~F 5문항 사다리 돌파 (총 30문항)] ➔ [4단계: 인지과학 종합 피드백]
           - 국어 30문항 (중심화제 ➔ 인과도식화 ➔ 숨은전제 ➔ 기출 ➔ 준킬러 ➔ 수능 킬러)
           - 수학 30문항 (기본공식 ➔ 기초응용 ➔ 복합심화 ➔ 평가원기출 ➔ 준킬러 ➔ 수능 킬러)
           - 영어 30문항 (구문/수일치 ➔ 대의파악 ➔ 연결사 ➔ 기출 ➔ 순서/삽입 ➔ 31~34번 빈칸 킬러)
           - 실시간 AI 임의 단원 생성 검색바 (국·수·영 어떤 단원이든 30문항 즉석 생성)
           - 수능 필수 킬러 18대 단원 라이브러리 전수 탑재

       (6) 📈 상세 분석 (GradeDetailedAnalysis)
           - 누적 시험 성적 다차원 통계, 취약 과목 편차 분석, 킬러 단원 정복률 종합 차트
    ============================================================================
  -->
  <!-- Kakao JS SDK (공유하기용, Phase 0: 학생 주도 공유. 키는 VITE_KAKAO_JS_KEY) -->

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        // 로컬 개발 환경(localhost / 127.0.0.1)에서는 Vite 개발 서버 모듈 요청 및 HMR 간섭을 방지하기 위해 SW 미등록 및 기존 SW 정리
        const isLocalDev = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
        if (isLocalDev) {
          navigator.serviceWorker.getRegistrations().then(registrations => {
            for (let registration of registrations) {
              registration.unregister();
            }
          });
          return;
        }

        // 프로덕션 환경에서만 안정적으로 서비스 워커 등록
        navigator.serviceWorker.register('/service-worker.js').then(registration => {
          console.log('SW registered: ', registration);
        }).catch(registrationError => {
          console.log('SW registration failed: ', registrationError);
        });
      });
    }
  </script>
